name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/sha para implantar"
        required: false
        default: main
      rollback:
        description: "Executar rollback para o commit anterior (.last-deploy) em vez de deploy"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DOMAIN: andersonrafhael.requiemcompany.com.br
  REMOTE_DIR: /opt/andersonrafhael
  GIT_REF: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checar secrets obrigatórios
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=()
          [[ -z "$VPS_HOST" ]] && missing+=("VPS_HOST")
          [[ -z "$VPS_SSH_KEY" ]] && missing+=("VPS_SSH_KEY")
          [[ -z "$VPS_KNOWN_HOSTS" ]] && missing+=("VPS_KNOWN_HOSTS")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Secrets ausentes: ${missing[*]}. Configure em Settings > Secrets and variables > Actions (ver docs/runbook.md, seção 'Deploy por Action')."
            exit 1
          fi
          echo "✓ Secrets obrigatórios presentes (VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS)."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Quality gate (typecheck + lint + build)
        run: npm run quality

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy (infra/deploy.sh)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_IP: ${{ secrets.VPS_IP }}
          APP_DOMAIN: ${{ env.APP_DOMAIN }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          GIT_REF: ${{ env.GIT_REF }}
        run: |
          if [[ "${{ github.event.inputs.rollback }}" == "true" ]]; then
            bash infra/deploy.sh --rollback
          else
            bash infra/deploy.sh
          fi
